<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <title>bookApp Android themed (monochrome) icon</title>
  <!-- Android recolours this using only its alpha channel, so depth comes from opacity. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <path d="M256 242 C232 224 196 222 176 230 L176 328 C196 320 232 322 256 340 Z" fill="#000000"/>
      <path d="M256 242 C280 224 316 222 336 230 L336 328 C316 320 280 322 256 340 Z" fill="#000000"/>
      <path d="M306 110 H344 V178 L325 161 L306 178 Z" fill="none" stroke="#000000" stroke-width="12" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g transform="translate(256 256) scale(0.8) translate(-256 -270)">
    <g transform="rotate(-16 256 270)" opacity="0.5"><rect x="141" y="110" width="230" height="300" rx="30" fill="#FFFFFF"/></g>
    <g transform="rotate(10 256 270)" opacity="0.75"><rect x="141" y="110" width="230" height="300" rx="30" fill="#FFFFFF"/></g>
    <rect x="141" y="110" width="230" height="300" rx="30" fill="#FFFFFF" mask="url(#cut)"/>
    <path d="M306 110 H344 V178 L325 161 L306 178 Z" fill="#FFFFFF"/>
  </g>
</svg>
