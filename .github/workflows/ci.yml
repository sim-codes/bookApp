# Checks every pull request and every push to main.
#
# prerequisites  Must pass before anything else runs, so a broken setup fails once with a clear reason:
#                - installs exactly what pnpm-lock.yaml pins; fails if package.json and the lockfile disagree,
#                  or if a dependency's install script has not been reviewed in pnpm-workspace.yaml
#                - prints the toolchain versions used
#                - checks every dependency matches the installed Expo SDK (expo install --check)
# typecheck, lint, test, build
#                Run in parallel once prerequisites pass. build bundles the Android JavaScript the way a
#                release does (expo export), which catches broken imports and missing assets; native builds
#                stay on EAS.
#
# Typed routes are generated by the Expo dev server and are not in git, so CI type-checks route paths as
# plain strings; everything else is fully type-checked. Each job reuses the pnpm store cache, so its
# install is quick.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prerequisites:
    name: Prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Toolchain versions
        run: |
          echo "node $(node --version)"
          echo "pnpm $(pnpm --version)"
          pnpm exec tsc --version
          echo "expo $(pnpm exec expo --version)"
      - name: Dependencies match the Expo SDK
        run: pnpm exec expo install --check

  typecheck:
    name: Type check
    needs: prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec tsc --noEmit

  lint:
    name: Lint
    needs: prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  test:
    name: Test
    needs: prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test --ci --maxWorkers=2

  build:
    name: Build
    needs: prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec expo export --platform android --output-dir dist
