name: Set up project
description: Installs pnpm and Node, restores the pnpm store cache, and installs exactly what pnpm-lock.yaml pins.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.16.1

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
