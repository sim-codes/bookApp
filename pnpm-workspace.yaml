# Reject dependency versions published less than 24h ago (supply-chain safety).
# EAS Build's pnpm enforces this default and fails the install otherwise.
minimumReleaseAge: 1440
# Expo SDK packages release as a set and require each other's newest patch,
# so they can't be resolved to older versions individually.
minimumReleaseAgeExclude:
  - expo
  - expo-*
  - '@expo/*'
  - babel-preset-expo

# pnpm 11 fails the install when a dependency has an unreviewed install script.
allowBuilds:
  esbuild: true
  # Ships prebuilt binaries and is only used by Jest's watch mode, so its build step is not needed.
  '@parcel/watcher': false
